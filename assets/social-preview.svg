<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Fixel — label an issue, get a reviewable pull request.">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c12"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58e2f7"/>
      <stop offset="1" stop-color="#1877ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.08" r="0.82">
      <stop offset="0" stop-color="#1877ec" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#1877ec" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1877ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="638" rx="31" fill="none" stroke="#26354a" stroke-width="2"/>

  <g transform="translate(72,72)">
    <rect width="90" height="90" rx="22" fill="#111b29" stroke="#293a52"/>
    <g transform="translate(-114,-13) scale(0.31)">
      <path fill="url(#brand)" d="M216 80 L330 80 L330 128 L258 128 L258 164 L318 164 L318 212 L258 212 L258 296 L200 264 L200 96 Z"/>
      <rect x="344" y="64" width="22" height="22" fill="#1877ec"/>
      <rect x="378" y="94" width="16" height="16" fill="#58e2f7"/>
      <rect x="344" y="120" width="26" height="26" fill="#2b9cf0"/>
      <rect x="336" y="180" width="20" height="20" fill="#1877ec"/>
      <rect x="368" y="154" width="13" height="13" fill="#38b6f2"/>
    </g>
    <text x="112" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="750" fill="#ffffff">fixel</text>
  </g>

  <text x="72" y="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="750" fill="#ffffff">Label an issue.</text>
  <text x="72" y="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="750" fill="url(#brand)">Get a reviewable pull request.</text>
  <text x="76" y="414" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#9eacc0">Open-source GitHub Action + CLI · powered by Claude</text>

  <g transform="translate(74,500)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="650">
    <rect width="214" height="62" rx="16" fill="#131d2a" stroke="#2a3a50"/>
    <circle cx="34" cy="31" r="10" fill="#38b6f2"/>
    <text x="58" y="38" fill="#dbe7f5">LABELED ISSUE</text>

    <path d="M306 31 H348" stroke="#43546b" stroke-width="3" stroke-linecap="round"/>
    <path d="M342 23 L350 31 L342 39" fill="none" stroke="#43546b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="370" width="258" height="62" rx="16" fill="#131d2a" stroke="#2a3a50"/>
    <rect x="396" y="21" width="20" height="20" rx="5" fill="#1877ec"/>
    <text x="432" y="38" fill="#dbe7f5">SANDBOXED AGENT</text>

    <path d="M650 31 H692" stroke="#43546b" stroke-width="3" stroke-linecap="round"/>
    <path d="M686 23 L694 31 L686 39" fill="none" stroke="#43546b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="714" width="258" height="62" rx="16" fill="#10233a" stroke="#1877ec"/>
    <path d="M744 22 V40 M744 22 L760 16 M744 40 L760 46" fill="none" stroke="#58e2f7" stroke-width="3" stroke-linecap="round"/>
    <text x="780" y="38" fill="#ffffff">PULL REQUEST</text>
  </g>

  <g opacity="0.75">
    <rect x="1130" y="82" width="28" height="28" rx="4" fill="#1877ec"/>
    <rect x="1172" y="120" width="18" height="18" rx="3" fill="#38b6f2"/>
    <rect x="1128" y="152" width="12" height="12" rx="2" fill="#58e2f7"/>
    <rect x="1192" y="430" width="24" height="24" rx="4" fill="#1877ec" opacity="0.55"/>
    <rect x="1150" y="468" width="14" height="14" rx="3" fill="#38b6f2" opacity="0.55"/>
