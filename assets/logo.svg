<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fixel logo">
  <defs>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd9f6"/>
      <stop offset="1" stop-color="#1877ec"/>
    </linearGradient>
    <linearGradient id="px" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38b6f2"/>
      <stop offset="1" stop-color="#1877ec"/>
    </linearGradient>
  </defs>

  <!-- dark card background -->
  <rect width="512" height="512" rx="40" fill="#0a0d12"/>

  <!-- the F mark -->
  <path fill="url(#fx)" d="M216 80 L330 80 L330 128 L258 128 L258 164 L318 164 L318 212 L258 212 L258 296 L200 264 L200 96 Z"/>

  <!-- pixels dissolving off the F -->
  <rect x="344" y="64"  width="22" height="22" fill="url(#px)"/>
  <rect x="378" y="94"  width="16" height="16" fill="#4fd9f6"/>
  <rect x="344" y="120" width="26" height="26" fill="url(#px)"/>
  <rect x="336" y="180" width="20" height="20" fill="url(#px)"/>
  <rect x="368" y="154" width="13" height="13" fill="#38b6f2"/>

  <!-- wordmark -->
  <text x="256" y="396" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" fill="#ffffff">fixel</text>
  <text x="260" y="446" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" fill="#8b95a5"
        letter-spacing="14">PROJECT</text>
</svg>
